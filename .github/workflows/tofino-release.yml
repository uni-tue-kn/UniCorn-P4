name: Publish optional Tofino release images

# Run after the normal release. Reuse a prepared SDK; never make BMv2 release
# wait for SDK source compilation. Manual dispatch remains available for retry.
on:
  workflow_run:
    workflows: [Release merged main pull request]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Completed standard release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      sdk_image:
        description: SDK image override matching the release Dockerfile pins
        required: false
        default: unituekn/unicornp4-tofino-sdk:tofino1-tofino2-6d8b203
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: unicorn-tofino-release
  cancel-in-progress: false

jobs:
  select:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.release.outputs.ready }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Select completed stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            tag=$REQUESTED_TAG
          else
            gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/pulls" --paginate --slurp > "$RUNNER_TEMP/tofino-merged-prs.json"
            tag=$(python3 - "$SOURCE_SHA" "$RUNNER_TEMP/tofino-merged-prs.json" <<'PY'
          import json, os, subprocess, sys
          from scripts.release_version import eligible_merge, next_version
          source, path = sys.argv[1:]
          if not eligible_merge(json.load(open(path)), os.environ['GITHUB_REPOSITORY'], source):
              raise SystemExit(2)
          version = subprocess.check_output(['git', 'show', f'{source}:VERSION'], text=True).strip()
          print('v' + next_version(version))
          PY
            ) || {
              echo 'The completed standard-release run was not for a newly merged main PR; no Tofino release is needed.'
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              exit 0
            }
          fi
          if ! gh release view "$tag" --json isDraft,isPrerelease,assets > "$RUNNER_TEMP/tofino-release.json"; then
            if [[ "$EVENT_NAME" == workflow_dispatch ]]; then exit 1; fi
            echo "The standard workflow did not publish $tag; no Tofino release is needed."
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - "$RUNNER_TEMP/tofino-release.json" <<'PY'
          import json, sys
          release = json.load(open(sys.argv[1]))
          assert not release['isDraft'] and not release['isPrerelease'], 'A published stable release is required'
          assert any(a['name'] == 'UniCorn-P4.tar.gz' for a in release['assets']), 'Standard release archive is missing'
          PY
          printf 'ready=true\ntag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: select
    if: needs.select.outputs.ready == 'true'
    runs-on: [self-hosted, linux, x64, tofino]
    timeout-minutes: 120
    env:
      TAG: ${{ needs.select.outputs.tag }}
      TOFINO_SDK_IMAGE: ${{ inputs.sdk_image || 'unituekn/unicornp4-tofino-sdk:tofino1-tofino2-6d8b203' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require completed standard release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json isDraft,isPrerelease,assets > "$RUNNER_TEMP/tofino-release.json"
          python3 - "$RUNNER_TEMP/tofino-release.json" <<'PY'
          import json, sys
          release = json.load(open(sys.argv[1]))
          assert not release['isDraft'] and not release['isPrerelease'], 'A published stable release is required'
          assert any(a['name'] == 'UniCorn-P4.tar.gz' for a in release['assets']), 'Standard release archive is missing'
          PY
      - name: Resolve the published SDK tag to an immutable digest
        run: |
          digest=$(bash scripts/resolve-image-digest.sh "$TOFINO_SDK_IMAGE")
          echo "TOFINO_SDK_IMAGE=$digest" >> "$GITHUB_ENV"
      - name: Verify trusted stable release and immutable SDK reference
        id: release
        run: bash scripts/prepare-tofino-release.sh
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.release.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pinned public native validation sources
        run: |
          git init "$RUNNER_TEMP/tofino-release-workshop"
          git -C "$RUNNER_TEMP/tofino-release-workshop" fetch --depth 1 https://github.com/n1tr0-5urf3r/tofino-rbfrt-workshop.git 336f13b0291c913c58babf74bd7b1399d4391d13
          git -C "$RUNNER_TEMP/tofino-release-workshop" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/tofino-release-workshop" rev-parse HEAD)" = 336f13b0291c913c58babf74bd7b1399d4391d13
      - name: Build all finished optional images on matching versioned bases
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: bash scripts/build-tofino-release.sh
      - name: Validate native packets, compiler HTTP service, and final runtime/backend
        env:
          VERSION: ${{ steps.release.outputs.version }}
          WORKSHOP_DIR: ${{ runner.temp }}/tofino-release-workshop
        run: bash scripts/validate-tofino-release.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: tofino-release-validation
          path: test-results/tofino-*
          retention-days: 14
      # Registry credentials are made available only after real native tests.
      - uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish optional version tags and promote only a current release
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE_FAMILY: tofino
        run: bash scripts/publish-images.sh
