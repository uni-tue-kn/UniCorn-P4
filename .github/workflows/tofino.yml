name: Native Tofino source validation

# The full SDK build is optional and expensive. Ordinary BMv2 CI continues to
# run the shared adapter, API, topology, and frontend regressions on every PR.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unicorn-tofino-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    # Reserve predictable headroom for a clean source build and its cache.
    runs-on: [self-hosted, linux, x64, tofino]
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check native build capacity
        run: |
          python3 - <<'PY'
          import pathlib, shutil
          free = shutil.disk_usage('.').free
          memory = int(next(line.split()[1] for line in pathlib.Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemTotal:'))) * 1024
          if free < 60 * 1024**3 or memory < 12 * 1024**3:
              raise SystemExit('The source-build preflight reserves 60 GiB free disk and 12 GiB RAM. Use a Docker-capable runner labelled tofino.')
          PY
          docker info > /dev/null
      - name: Fetch the pinned public workshop P4 validation sources
        run: |
          git init "$RUNNER_TEMP/workshop"
          git -C "$RUNNER_TEMP/workshop" remote add origin https://github.com/n1tr0-5urf3r/tofino-rbfrt-workshop.git
          git -C "$RUNNER_TEMP/workshop" fetch --depth 1 origin 336f13b0291c913c58babf74bd7b1399d4391d13
          git -C "$RUNNER_TEMP/workshop" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/workshop" rev-parse HEAD)" = 336f13b0291c913c58babf74bd7b1399d4391d13
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/tofino/Dockerfile
          target: compiler
          build-args: |
            SDK_IMAGE=build
            OPEN_P4STUDIO_REV=6d8b203700e3ca0f1208418072f88dc4a6a597e8
            P4C_REV=ff5070480d76cd171df54051404f118d005fbf5e
            BUILD_JOBS=2
          load: true
          tags: unicorn-tofino-native:ci
          cache-from: type=gha,scope=tofino-native
          cache-to: type=gha,scope=tofino-native,mode=max
      - name: Compile and exercise real model packets and externs
        run: |
          mkdir -p test-results
          set -o pipefail
          docker run --rm --network none --cap-drop ALL --cap-add NET_ADMIN --cap-add NET_RAW \
            --security-opt no-new-privileges:true \
            -v "$PWD/tests/tofino:/tests:ro" \
            -v "$PWD/examples/p4/tofino:/sources:ro" \
            -v "$RUNNER_TEMP/workshop:/workshop:ro" \
            --entrypoint bash unicorn-tofino-native:ci /tests/run_native.sh 2>&1 | tee test-results/tofino-native.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: tofino-native-results
          path: test-results/tofino-native.log
          retention-days: 14
