name: Test and build UniCorn-P4

on:
  push:
    branches: [main, dev, nightly-registers-runtime-ui]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unicorn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            netsim/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt -r netsim/requirements-dev.txt
      - name: Backend and component version regressions
        env:
          PYTHONPATH: .:backend
          UPDATE_CHECK_ENABLED: 'false'
        run: python -m pytest tests/backend tests/unit tests/netsim runtime/tests -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/backend/Dockerfile
          build-args: BUILD_JOBS=2
          load: true
          tags: unicorn-test-backend
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/netsim/Dockerfile
          build-args: BUILD_JOBS=2
          load: true
          tags: unicorn-test-netsim
          cache-from: type=gha,scope=netsim
          cache-to: type=gha,mode=max,scope=netsim
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/frontend/Dockerfile
          load: true
          tags: unicorn-test-frontend
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Build upstream runtimes and exercise real switches through the browser
        env:
          E2E_SKIP_BUILD: 'true'
        run: bash scripts/test-e2e.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: integration-results
          path: |
            test-results/
            tests/e2e/playwright-report/
          retention-days: 14
