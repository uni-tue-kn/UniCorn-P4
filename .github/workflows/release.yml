name: Release merged main pull request

on:
  workflow_run:
    workflows: [Test and build UniCorn-P4]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: unicorn-release-main
  cancel-in-progress: false

jobs:
  release:
    # A successful PR check/fork workflow cannot use the release credentials.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Verify tested commit is the result of a merged pull request
        run: gh api "repos/$GITHUB_REPOSITORY/commits/$TESTED_SHA/pulls" --paginate --slurp > "$RUNNER_TEMP/merged-prs.json"
      - name: Prepare release version and matching frontend manifests
        id: version
        run: >-
          python3 scripts/release_version.py --tested-sha "$TESTED_SHA"
          --merged-prs "$RUNNER_TEMP/merged-prs.json" --commit --output "$GITHUB_OUTPUT"
      - name: Reserve release commit and tag atomically
        if: steps.version.outputs.ready == 'true' && steps.version.outputs.reserve_needed == 'true'
        env:
          COMMIT: ${{ steps.version.outputs.commit }}
          TAG: ${{ steps.version.outputs.tag }}
        run: git push --atomic origin "$COMMIT:refs/heads/main" "refs/tags/$TAG"
      - name: Check whether this release already completed
        id: published
        if: steps.version.outputs.ready == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          complete=false
          if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -Fxq UniCorn-P4.tar.gz; then
            complete=true
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
        if: steps.version.outputs.ready == 'true' && steps.published.outputs.complete != 'true'
      - uses: docker/login-action@v4.7.0
        if: steps.version.outputs.ready == 'true' && steps.published.outputs.complete != 'true'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # Build all components before publishing any image. Each image bakes the
      # reserved VERSION, so its reported version matches the release asset.
      - uses: docker/build-push-action@v7.4.0
        if: steps.version.outputs.ready == 'true' && steps.published.outputs.complete != 'true'
        with:
          context: .
          file: docker/backend/Dockerfile
          build-args: BUILD_JOBS=2
          load: true
          tags: unituekn/unicornp4-backend:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v7.4.0
        if: steps.version.outputs.ready == 'true' && steps.published.outputs.complete != 'true'
        with:
          context: .
          file: docker/netsim/Dockerfile
          build-args: BUILD_JOBS=2
          load: true
          tags: unituekn/unicornp4-netsim:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=netsim
          cache-to: type=gha,mode=max,scope=netsim
      - uses: docker/build-push-action@v7.4.0
        if: steps.version.outputs.ready == 'true' && steps.published.outputs.complete != 'true'
        with:
          context: .
          file: docker/frontend/Dockerfile
          load: true
          tags: unituekn/unicornp4-frontend:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Compile tracked examples and build download archive
        if: steps.version.outputs.ready == 'true' && steps.published.outputs.complete != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          python3 scripts/package_release.py --output "$RUNNER_TEMP/UniCorn-P4.tar.gz"
          --compiler-image "unituekn/unicornp4-backend:$VERSION"
      - name: Publish versioned images and promote current release
        id: images
        if: steps.version.outputs.ready == 'true' && steps.published.outputs.complete != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/publish-images.sh
      - name: Publish GitHub release and deployment archive
        if: steps.version.outputs.ready == 'true' && steps.published.outputs.complete != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          LATEST: ${{ steps.images.outputs.latest }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/UniCorn-P4.tar.gz" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/UniCorn-P4.tar.gz" --verify-tag --title "v$VERSION" --generate-notes --latest="$LATEST"
          fi
