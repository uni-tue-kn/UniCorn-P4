# Isolated native tests. Combine with docker-compose.test.yaml.
services:
  backend:
    image: ${TOFINO_BACKEND_IMAGE:-unicorn-tofino-test-backend:local}
    build:
      dockerfile: docker/tofino/Dockerfile
      target: backend
      args:
        SDK_IMAGE: ${TOFINO_SDK_IMAGE:-ghcr.io/n1tr0-5urf3r/open-p4studio@sha256:1431aaa7183f30191c16fda9880dc916b3e73fc2db14e93dc45177a48291412c}
    environment:
      TOFINO_COMPILER_URL: http://127.0.0.1:8080
  netsim:
    image: ${TOFINO_NETSIM_IMAGE:-unicorn-tofino-test-netsim:local}
    build:
      dockerfile: docker/tofino/Dockerfile
      target: runtime
      args:
        SDK_IMAGE: ${TOFINO_SDK_IMAGE:-ghcr.io/n1tr0-5urf3r/open-p4studio@sha256:1431aaa7183f30191c16fda9880dc916b3e73fc2db14e93dc45177a48291412c}
    volumes:
      - test-p4:/p4:ro
  frontend:
    image: unicorn-tofino-test-frontend:local
  compiler:
    init: true
    image: ${TOFINO_COMPILER_IMAGE:-unicorn-tofino-test-compiler:local}
    build:
      context: ..
      dockerfile: docker/tofino/Dockerfile
      target: compiler
      args:
        SDK_IMAGE: ${TOFINO_SDK_IMAGE:-ghcr.io/n1tr0-5urf3r/open-p4studio@sha256:1431aaa7183f30191c16fda9880dc916b3e73fc2db14e93dc45177a48291412c}
    network_mode: service:netsim
    environment:
      P4_DIR: /p4
    volumes:
      - test-p4:/p4
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
