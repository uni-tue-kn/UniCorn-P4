# Isolated native tests. Combine with docker-compose.test.yaml.
services:
  backend:
    image: ${TOFINO_BACKEND_IMAGE:-unicorn-tofino-test-backend:local}
    build:
      dockerfile: docker/tofino/Dockerfile
      target: backend
      args:
        SDK_IMAGE: ${TOFINO_SDK_IMAGE:-unituekn/unicornp4-tofino-sdk@sha256:b6a4c770c9c483a2b125e4de4c3d32eb7d046a6e69648c534707ac7a655904a3}
    environment:
      TOFINO_COMPILER_URL: http://127.0.0.1:8080
  netsim:
    image: ${TOFINO_NETSIM_IMAGE:-unicorn-tofino-test-netsim:local}
    build:
      dockerfile: docker/tofino/Dockerfile
      target: runtime
      args:
        SDK_IMAGE: ${TOFINO_SDK_IMAGE:-unituekn/unicornp4-tofino-sdk@sha256:b6a4c770c9c483a2b125e4de4c3d32eb7d046a6e69648c534707ac7a655904a3}
    volumes:
      - test-p4:/p4:ro
  frontend:
    image: ${E2E_FRONTEND_IMAGE:-unicorn-tofino-test-frontend:local}
  compiler:
    init: true
    image: ${TOFINO_COMPILER_IMAGE:-unicorn-tofino-test-compiler:local}
    build:
      context: ..
      dockerfile: docker/tofino/Dockerfile
      target: compiler
      args:
        SDK_IMAGE: ${TOFINO_SDK_IMAGE:-unituekn/unicornp4-tofino-sdk@sha256:b6a4c770c9c483a2b125e4de4c3d32eb7d046a6e69648c534707ac7a655904a3}
    network_mode: service:netsim
    environment:
      P4_DIR: /p4
    volumes:
      - test-p4:/p4
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
